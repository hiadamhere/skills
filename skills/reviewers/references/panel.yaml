# reviewers -- default panel manifest
#
# THE single source for the roster, the severity scale, the verdict map, and the
# cost controls. Adapters and lenses READ this file; none of them restate it.
#
# DO NOT EDIT THIS FILE TO CUSTOMIZE. It ships with the skill and is replaced on
# every update. Put your changes in `panel.local.yaml` instead -- see
# `customizing.md`. Anything you write there survives updates; anything you write
# here does not.

version: 1

# ---------------------------------------------------------------------------
# Severity -- shared by every lens, most severe first.
# ---------------------------------------------------------------------------
severity: [blocker, high, medium, low, info]

# ---------------------------------------------------------------------------
# Verdicts. Each lens returns one word from its own vocabulary; every word maps
# to exactly one unified level. WORST CASE WINS across the panel -- a single
# `block` outranks every approval. Deliberately not a vote: averaging dilutes the
# one specialist who saw what nobody else was looking for.
# ---------------------------------------------------------------------------
verdicts:
  block:
    description: Do not merge. Wrong, unproven, or unsafe as written.
    words: [reject, unproven, needs-rework, needs-redesign, breaking, exposed]
  fix-first:
    description: Mergeable once the named findings are addressed.
    words: [fix-first, approve-with-changes, document-first, measure-first]
  ship:
    description: Nothing that should gate the merge.
    words: [ship, approve, no-findings, proceed, clean]

# ---------------------------------------------------------------------------
# Cost controls. An expensive gate gets skipped, and a skipped gate catches
# nothing. These keep the panel cheap enough to run on every change.
# ---------------------------------------------------------------------------
limits:
  trivial_change:
    description: Typo, comment, or pure rename with no behavioral or contractual effect.
    response: one-line acknowledgement
  scope_cap:
    max_files: 50
    max_lines: 2000
    max_findings_per_reviewer: 10

# ---------------------------------------------------------------------------
# Lessons -- paths every lens consults BEFORE hunting new findings, so a defect
# you already paid for is never rediscovered from scratch. Empty by default;
# point it at your own post-mortems, ADRs, or incident notes in panel.local.yaml.
# ---------------------------------------------------------------------------
lessons: []

# ---------------------------------------------------------------------------
# Roster.
#
# The default pack is organised by WHO PAYS when a change is wrong, not by job
# title. Four `core` lenses ask a question every change must answer. Four
# `triggered` lenses cost nothing until a change touches their surface.
#
#   mode: core       always dispatched
#   mode: triggered  dispatched when a `triggers` glob matches, or on a full pass
#   mode: disabled   never dispatched (set this in panel.local.yaml to turn one off)
# ---------------------------------------------------------------------------
reviewers:
  - name: correctness
    file: lenses/correctness.md
    mode: core
    owns: Whether the change does what it claims, including at the edges nobody tried.

  - name: evidence
    file: lenses/evidence.md
    mode: core
    owns: Whether we know it works, or merely believe it. Test quality over test count.

  - name: risk
    file: lenses/risk.md
    mode: core
    owns: Blast radius. What happens when this fails, who notices, and how it is undone.

  - name: clarity
    file: lenses/clarity.md
    mode: core
    owns: Whether the next person can change this safely without archaeology.

  - name: security
    file: lenses/security.md
    mode: triggered
    owns: Untrusted input, secrets, authorization, and the trust boundaries a change moves.
    triggers: ["**/auth*/**", "**/*login*", "**/*password*", "**/*token*", "**/*crypt*",
               "**/api/**", "**/routes/**", "**/*serial*", "**/*upload*", "**/*.sql",
               "**/Dockerfile*", "**/*.tf", "**/.github/workflows/**"]

  - name: performance
    file: lenses/performance.md
    mode: triggered
    owns: Work done per request, allocation in hot paths, and blocking where it must not block.
    triggers: ["**/*cache*", "**/*queue*", "**/*worker*", "**/*batch*", "**/*stream*",
               "**/*render*", "**/*query*", "**/*index*", "**/migrations/**"]

  - name: interface
    file: lenses/interface.md
    mode: triggered
    owns: Compatibility of anything someone else already depends on -- API, schema, CLI, config, events.
    triggers: ["**/*.proto", "**/*.graphql", "**/openapi*", "**/swagger*", "**/schema*",
               "**/migrations/**", "**/public-api/**", "**/*.d.ts", "**/cli/**", "**/*.csproj"]

  - name: docs
    file: lenses/docs.md
    mode: triggered
    owns: Whether the prose that explains this change still tells the truth after it.
    triggers: ["**/*.md", "**/docs/**", "**/README*", "**/CHANGELOG*", "**/*.mdx"]
